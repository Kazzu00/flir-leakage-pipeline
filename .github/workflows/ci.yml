name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - name: Install core, development and reduction dependencies
        run: uv sync --locked --extra dev --extra reduction
      - name: Ruff check
        run: uv run ruff check .
      - name: Tests
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          NUMBA_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: uv run pytest
      - name: Check source notebook
        run: uv run python scripts/check_notebook_source.py
