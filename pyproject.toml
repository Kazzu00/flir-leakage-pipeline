[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flir-leakage-pipeline"
version = "0.1.0"
description = "Reproducible research pipeline for leakage-aware analysis of FLIR video frames."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "pillow>=10.0",
    "pyarrow>=15.0",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "scipy>=1.12",
    "tqdm>=4.66",
    "typer>=0.12",
]

[project.optional-dependencies]
vision = [
    "torch>=2.2",
    "torchvision>=0.17",
    "transformers>=4.40",
]
reporting = [
    "jupyter>=1.0",
    "nbclient>=0.10",
    "nbconvert>=7.16",
    "nbformat>=5.10",
]
dev = [
    "pre-commit>=3.7",
    "pytest>=8.1",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
flir-pipeline = "flir_pipeline.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/flir_pipeline"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
