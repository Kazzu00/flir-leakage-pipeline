# Shared objective and solver for both policies. Ratios are explicit, never
# estimated from historical assignments. This command never admits training.
strategy: cluster_aware
target_ratios: [0.7, 0.15, 0.15]
seeds: [0, 1, 2, 3, 4]
node_limit: 32
mip_rel_gap: 0.001
record_weight: 1.0
class_weight: 1.0
empty_weight: 1.0
