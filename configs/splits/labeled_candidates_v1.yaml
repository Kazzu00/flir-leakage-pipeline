# No data paths or private identities. Targets use historical occurrences only.
protocol_version: labeled_candidates_v1
balance:
  strategy: cluster_aware
  target_ratios: null
  seeds: [0, 1, 2, 3, 4]
  node_limit: 32
  mip_rel_gap: 0.001
  record_weight: 1.0
  class_weight: 1.0
  empty_weight: 1.0
sensitivity_states: [visual_candidate, unresolved, confirmed_provenance]
review_conflict_policy: error
# Optional post-solve acceptance ceiling; not a hard constraint in the MILP.
max_relative_record_deviation: null
