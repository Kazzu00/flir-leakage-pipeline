# One shared protocol; feature and similarity directories are explicit CLI inputs.
method: tsne
output_dimension: 2
input_representation: embeddings_l2
preprocessing: none
seeds: [0, 1, 2]
grid:
  perplexity: [10, 30, 50]
hyperparameters:
  init: pca # Coordinates initialization only; input remains full dimensional.
  learning_rate: auto
  max_iter: 1000
  early_exaggeration: 12.0
  metric: euclidean
  method: barnes_hut
  angle: 0.5
  n_iter_without_progress: 300
  min_grad_norm: 0.0000001
evaluation_ks: [5, 10, 20]
distance_sample_size: 100000
distance_sample_seed: 0
